<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="admin-upload.css" />
</head>
<body>

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <span>City Portal</span>
      <h2>Admin Dashboard</h2>
    </div>
    <nav>
      <a href="admin-dashboard.html">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
          <rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
        </svg>
        Dashboard
      </a>
      <a href="admin-upload.html" class="active">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/>
          <line x1="9" y1="15" x2="15" y2="15"/>
        </svg>
        Upload New Ordinance
      </a>
      <a href="admin-login.html">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17 16l4-4m0 0l-4-4m4 4H7"/>
        </svg>
        Logout
      </a>
    </nav>
  </aside>

  <!-- Main Content -->
  <main class="main">
    <div class="page-header">
      <p class="breadcrumb">Documents</p>
      <h1>Upload New Ordinance</h1>
    </div>

        </div>
    <div class="card">
      <form id="ordinanceUploadForm" enctype="multipart/form-data">
        <div class="form-grid">
          <div class="form-group">
            <label for="ordinance_number">Ordinance Number</label>
            <input type="text" id="ordinance_number" name="ordinance_number" placeholder="e.g. ORD-2024-001" required />
          </div>
          <div class="form-group">
            <label for="date_passed">Date Passed</label>
            <input type="date" id="date_passed" name="date_passed" required />
          </div>
          <div class="form-group full">
            <label for="title">Title</label>
            <input type="text" id="title" name="title" placeholder="Enter ordinance title" required />
          </div>
          <div class="form-group full">
            <label for="category">Category</label>
            <input type="text" id="category" name="category" placeholder="e.g. Zoning, Public Safety…" />
          </div>
          <div class="form-group full">
            <label for="description">Summary / Description</label>
            <textarea id="description" name="description" placeholder="Provide a brief summary of this ordinance…"></textarea>
          </div>
          <div class="form-group full">
            <label>Upload Document</label>
            <div class="file-upload-wrapper">
              <label class="file-upload-label">
                <input type="file" id="file" name="file" accept=".pdf,.png,.jpg,.jpeg" />
                <div class="file-icon">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                    <polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>
                  </svg>
                </div>
                <div class="file-text">
                  <div class="file-title">Click to choose a file</div>
                  <div class="file-sub">PDF, PNG, JPG supported</div>
                </div>
              </label>
            </div>
          </div>
        </div>
        <hr class="divider" />
        <div class="form-actions">
          <button type="submit" class="btn-primary">Upload Ordinance</button>
          <button type="button" class="btn-secondary" id="cancelUpload">Cancel</button>
        </div>
      </form>
    </div>
  </main>

</main>

<script>
document.addEventListener('DOMContentLoaded', function() {
  const fileInput = document.getElementById('file');
  const fileTitle = document.querySelector('.file-title');
  if (fileInput && fileTitle) {
    fileInput.addEventListener('change', function() {
      if (fileInput.files && fileInput.files.length > 0) {
        fileTitle.textContent = fileInput.files[0].name;
      } else {
        fileTitle.textContent = 'Click to choose a file';
      }
    });
  }
});
</script>
</body>
</html>
