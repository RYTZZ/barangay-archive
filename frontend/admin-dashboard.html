<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>
  <link rel="stylesheet" href="admin-style.css">
</head>
<body>
  <div class="dashboard-container">
    <aside class="sidebar">
      <div class="sidebar-header">
        <span class="logo">Barangay Archive Admin</span>
      </div>
      <ul class="sidebar-menu">
        <li><a href="#" class="active">Dashboard</a></li>
        <li><a href="admin-upload.html">Upload</a></li>
        <li><a href="admin-login.html">Logout</a></li>
      </ul>
    </aside>
    <main class="dashboard-main">
      <section class="stats">
        <h2>Statistics</h2>
        <div class="stats-cards" id="statsContainer">
          <!-- Stats will be loaded here as cards -->
        </div>
      </section>
      <section class="crud">
        <div class="crud-header">
          <h2>Ordinances</h2>
          <button id="addOrdinanceBtn">Add Ordinance</button>
        </div>
        <div class="table-responsive">
          <table id="ordinanceTable">
            <thead>
              <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Date</th>
                <th>File</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              <!-- Ordinances will be loaded here -->
            </tbody>
          </table>
        </div>
        <div id="ordinanceFormContainer" class="modal hidden">
          <form id="ordinanceForm">
            <h3 id="formTitle">Add Ordinance</h3>
            <input type="hidden" name="id" id="ordinanceId">
            <label>Title: <input type="text" name="title" id="ordinanceTitle" required></label>
            <label>Date: <input type="date" name="date" id="ordinanceDate" required></label>
            <label>File: <input type="file" name="file" id="ordinanceFile"></label>
            <div class="form-actions">
              <button type="submit">Save</button>
              <button type="button" id="cancelBtn">Cancel</button>
            </div>
          </form>
        </div>
      </section>
    </main>
  </div>
  <script src="admin-script.js"></script>
  <script src="admin-script.js"></script>
</body>
</html>
